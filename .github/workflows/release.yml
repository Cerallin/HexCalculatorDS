name: release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.repo.outputs.repo }}
    steps:
      - name: Set lowercase repository name
        id: repo
        run: |
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

  release_build:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        theme: [light, dark]

    container:
      image: ghcr.io/${{ needs.prepare.outputs.repo }}/devkitarm:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Configure
        run: |
          cmake -S . -B build \
              -DTHEME=${{ matrix.theme }} \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=cmake/devkitarm-toolchain.cmake

      - name: Build
        run: |
          cmake --build build
          tag="${{ github.event.release.tag_name }}"
          mv build/HexCalculatorDS.nds build/HexCalculatorDS-${tag}-${{ matrix.theme }}.nds

      - name: Package release artifact
        run: |
          tag="${{ github.event.release.tag_name }}"
          zip -j "HexCalculatorDS-${tag}-${{ matrix.theme }}.zip" build/*.nds

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: HexCalculatorDS-${{ github.event.release.tag_name }}-${{ matrix.theme }}.zip
